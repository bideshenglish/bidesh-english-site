<style>
  :root{
    color-scheme:light only;
    --pine:#0C3A27; --pine-2:#14582B; --leaf:#1F8A36; --leaf-deep:#17692A; --leaf-soft:#E2F1E4;
    --sun:#F4B93E; --sun-deep:#D99A12; --sun-soft:#FCEBC4; --ink:#14261C; --ink-soft:#33463B;
    --page:#DFEEE3; --paper:#F1F8F2; --line:#A9C9B3;
    --bad-bg:#FDE6E0; --bad-ink:#7A1F10; --good-bg:#DDF3E1; --good-ink:#0C3A27;
    --font:'Anek Bangla','Noto Sans Bengali','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:17px;font-weight:500;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:linear-gradient(180deg,#B5DCF1 0,#CFE9EE 280px,var(--page) 560px);background-repeat:no-repeat;}
  button{font-family:inherit;}
  svg{display:block;}
  :focus-visible{outline:3px solid var(--pine);outline-offset:3px;border-radius:10px;}
  .wrap{width:100%;max-width:680px;margin:0 auto;padding:0 18px;}

  /* ---------- top bar ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:10px;gap:12px;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--pine);font-weight:700;text-decoration:none;font-size:16.5px;padding:8px 16px 8px 12px;background:#fff;border-radius:999px;box-shadow:0 2px 10px -3px rgba(12,58,39,0.35);}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--pine);font-weight:800;font-size:17px;}
  .brand img{width:34px;height:34px;border-radius:50%;box-shadow:0 2px 8px -2px rgba(12,58,39,0.4);}

  /* ---------- title ---------- */
  h1{margin:14px 0 2px;font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1.16;color:var(--pine);letter-spacing:-0.02em;}
  .sub{margin:0 0 18px;color:var(--ink-soft);font-size:18px;font-weight:600;}

  /* ---------- flight-path progress ---------- */
  .stepname{margin:0 0 2px;font-weight:700;color:var(--ink-soft);font-size:16px;}
  .pctrow{position:relative;height:26px;}
  .pct{position:absolute;top:0;font-size:19px;font-weight:800;color:var(--leaf-deep);line-height:26px;white-space:nowrap;transition:left .5s ease, transform .5s ease;}
  .track{position:relative;height:30px;margin:0 0 4px;}
  .track::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);
    background:radial-gradient(circle,#6E9A7B 1.7px,transparent 2.2px) 0 50% / 10px 4px repeat-x;}
  .track .fill{position:absolute;left:0;top:50%;height:4px;transform:translateY(-50%);border-radius:99px;background:var(--leaf-deep);min-width:4px;transition:width .5s ease;}
  .plane{position:absolute;top:50%;left:0;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px -2px rgba(12,58,39,0.5);transition:left .5s ease, transform .5s ease;}
  .plane svg{width:17px;height:17px;transform:rotate(90deg);fill:var(--pine);}

  /* ---------- card ---------- */
  .card{background:#fff;border-radius:28px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(12,58,39,0.08),0 30px 50px -30px rgba(12,58,39,0.55);outline:none;}
  .card.enter{animation:rise .32s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .card h2{margin:0 0 12px;font-size:23px;line-height:1.35;color:var(--pine);font-weight:800;letter-spacing:-0.01em;}
  .lede{font-size:19.5px;line-height:1.8;margin:0 0 6px;color:var(--ink);font-weight:600;}
  .counter{font-weight:700;color:var(--ink-soft);font-size:16px;margin:0 0 6px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:2px solid transparent;border-radius:999px;padding:14px 26px;font-weight:800;font-size:17.5px;cursor:pointer;text-decoration:none;line-height:1.3;transition:transform .12s ease, box-shadow .12s ease;}
  .btn svg{width:20px;height:20px;fill:currentColor;}
  .btn:active{transform:translateY(1px);}
  .btn-main{background:var(--sun);color:var(--pine);box-shadow:0 10px 18px -10px rgba(190,120,0,0.8),inset 0 -3px 0 rgba(0,0,0,0.08);}
  .btn-alt{background:#fff;color:var(--pine);border-color:var(--pine);}
  .btn[disabled]{background:#DCE6DE;color:#3D4F44;border-color:#B4CFBB;box-shadow:none;cursor:not-allowed;}
  .row .btn-main:only-child{flex:1 1 100%;}

  /* ---------- scene ---------- */
  .scene-ic{width:54px;height:54px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;margin-bottom:14px;}
  .scene-ic svg{width:26px;height:26px;fill:var(--leaf-deep);transform:rotate(-45deg);}

  /* ---------- phrase ticket ---------- */
  .card.s-phrases{padding:0;overflow:hidden;}
  .tk-top{background-color:var(--pine-2);background-image:linear-gradient(160deg,#1A7A2E,#0F5A22);color:#fff;}
  .tk-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 10px;color:#fff;}
  .dots{display:flex;gap:5px;padding:0 20px 16px;}
  .dots i{flex:1 1 0;max-width:34px;height:5px;border-radius:99px;background:rgba(255,255,255,0.28);transition:background .25s ease, flex-grow .25s ease;}
  .dots i.on{background:rgba(255,255,255,0.92);}
  .dots i.now{background:var(--sun);flex-grow:1.8;}
  .tag.ear{background:var(--leaf-soft);color:var(--pine);}
  .tk-count{font-weight:700;font-size:16px;color:#fff;}
  .tag{display:inline-block;padding:2px 14px;border-radius:999px;background:var(--sun-soft);color:#4A3000;font-weight:800;font-size:15.5px;line-height:1.6;}
  .tk-body{padding:26px 20px 20px;}
  .ph-bn{margin:12px 0 0;font-size:clamp(19px,5.2vw,22px);font-weight:700;line-height:1.6;color:var(--ink-soft);}
  .ph-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .play{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:0 22px 0 14px;height:52px;border-radius:999px;background:var(--leaf-deep);color:#fff;font-weight:800;font-size:18px;box-shadow:0 10px 18px -8px rgba(12,58,39,0.7);transition:transform .12s ease;}
  .play:active{transform:scale(.97);}
  .play:focus-visible{outline:3px solid var(--pine);outline-offset:3px;}
  .play-ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.18);display:grid;place-items:center;}
  .play-ic svg{width:20px;height:20px;fill:#fff;}
  .play.playing .play-ic{animation:pulse 1s ease-in-out infinite;}
  .slow.playing{background:var(--leaf-soft);border-color:var(--leaf-deep);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.55);}50%{box-shadow:0 0 0 7px rgba(255,255,255,0);}}
  .pr-label{display:block;font-size:14.5px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;}
  .pr-text{margin:0;font-size:18px;font-weight:700;line-height:1.6;color:var(--leaf-deep);background:var(--leaf-soft);padding:10px 14px;border-radius:14px;}
  .btn-next{width:100%;font-size:19px;padding:16px 26px;}
  .btn-next svg{width:22px;height:22px;}
  .tk-main{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .big-en{font-size:clamp(25px,6.6vw,32px);font-weight:800;line-height:1.3;color:var(--pine);margin:0;letter-spacing:-0.015em;}
  .hear{all:unset;box-sizing:border-box;flex:none;width:56px;height:56px;border-radius:50%;background:var(--leaf-deep);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 18px -8px rgba(12,58,39,0.7);}
  .hear svg{width:26px;height:26px;fill:#fff;}
  .hear:active{transform:scale(.96);}
  .hear:focus-visible{outline:3px solid var(--pine);outline-offset:3px;}
  .tk-perf{border-top:2.5px dashed #B9D3C0;margin:0 20px;}
  .tk-foot{padding:18px 20px 6px;background:#fff;}
  .bn-line{font-size:20px;font-weight:700;margin:0 0 10px;color:var(--ink);line-height:1.6;}
  .pr-line{font-size:17px;color:var(--leaf-deep);font-weight:700;margin:0;background:var(--leaf-soft);display:inline-block;padding:5px 14px;border-radius:12px;}
  .tk-actions{padding:6px 20px 22px;}
  .tk-actions .row{margin-top:14px;}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:14px;}
  .opt{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:13px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:15px 16px;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.45;transition:border-color .15s ease, background .15s ease, transform .1s ease;}
  .opt::before{content:'';flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #7EA88B;background:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;line-height:1;}
  .opt:hover{border-color:var(--leaf);background:#fff;}
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:3px solid var(--pine);outline-offset:2px;}
  .opt.good{background:var(--good-bg);border-color:var(--leaf-deep);color:var(--good-ink);}
  .opt.good::before{content:'✓';background:var(--leaf-deep);border-color:var(--leaf-deep);}
  .opt.bad{background:var(--bad-bg);border-color:#C24A33;color:var(--bad-ink);}
  .opt.bad::before{content:'✕';background:#B23A24;border-color:#B23A24;}
  .opt[aria-disabled="true"]{cursor:default;}
  .opts.tf{flex-direction:row;gap:12px;}
  .opts.tf .opt{justify-content:center;font-size:20px;padding:18px 12px;}
  .opts.tf .opt::before{display:none;}
  .opts.tf .opt.good::before,.opts.tf .opt.bad::before{display:grid;}
  .note{margin:16px 0 0;padding:13px 16px;border-radius:16px;font-weight:600;font-size:17px;line-height:1.6;}
  .note.good{background:var(--good-bg);color:var(--good-ink);}
  .note.bad{background:var(--bad-bg);color:var(--bad-ink);}
  .note.info{background:var(--sun-soft);color:#4A3000;}

  /* ---------- chat ---------- */
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .bubble{max-width:90%;padding:12px 16px;border-radius:20px;font-weight:600;line-height:1.5;}
  .bubble small{display:block;font-weight:500;font-size:16px;margin-top:4px;}
  .b-boss{align-self:flex-start;background:var(--paper);border:1.5px solid #C5DCCB;color:var(--ink);border-bottom-left-radius:6px;}
  .b-boss small{color:var(--ink-soft);}
  .b-me{align-self:flex-end;background:#1A7A2E;color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 16px -10px rgba(12,58,39,0.8);}
  .who{display:block;font-size:15px;font-weight:700;margin-bottom:2px;}
  .b-boss .who{color:var(--leaf-deep);}
  .b-me .who{color:#fff;}
  .stars{font-size:22px;letter-spacing:2px;}
  .mic-status{min-height:30px;font-weight:700;color:var(--pine);margin:14px 0 0;font-size:17px;}
  .speak-box{background:var(--paper);border:1.5px solid #C5DCCB;border-radius:20px;padding:18px 18px 16px;margin:6px 0 0;}
  .speak-box .tk-main{margin-bottom:8px;}

  /* ---------- result ---------- */
  .result{text-align:center;}
  .result .party{font-size:54px;line-height:1.1;margin:2px 0 6px;}
  .big-stars{font-size:40px;letter-spacing:5px;margin:4px 0 2px;}
  .big-stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pop{from{opacity:0;transform:scale(.2) rotate(-25deg);}to{opacity:1;transform:none;}}
  .score-line{font-weight:700;color:var(--pine);margin:0 0 16px;font-size:19px;}
  .stats{list-style:none;padding:0;margin:0 auto 6px;max-width:420px;text-align:left;background:var(--paper);border-radius:18px;padding:4px 16px;}
  .stats li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #C5DCCB;font-weight:600;}
  .stats li:last-child{border-bottom:none;}
  .stats b{color:var(--pine);font-weight:800;}
  .streak{margin:16px 0 0;display:inline-block;background:var(--sun-soft);color:#4A3000;font-weight:800;padding:8px 18px;border-radius:999px;font-size:18px;}
  .result .row{justify-content:center;}
  .missing{text-align:center;padding:26px 6px;}
  /* ---------- back button ---------- */
  .backrow{height:28px;margin:0 0 6px;}
  .backmini{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:14.5px;font-weight:700;line-height:1.6;color:var(--ink-soft);padding:1px 13px 1px 9px;border-radius:999px;background:rgba(255,255,255,0.8);border:1px solid var(--line);}
  .backmini:hover{background:#fff;color:var(--pine);}
  .backmini:focus-visible{outline:3px solid var(--pine);outline-offset:2px;}

  /* ---------- short feedback ---------- */
  .fb{display:flex;align-items:center;gap:12px;margin-top:16px;padding:11px 14px;border-radius:16px;animation:fbIn .25s ease both;}
  .fb.ok{background:var(--good-bg);} .fb.no{background:var(--bad-bg);} .fb.mid{background:var(--sun-soft);}
  .fb-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;line-height:1;}
  .fb.ok .fb-ic{background:var(--leaf-deep);} .fb.no .fb-ic{background:#B23A24;} .fb.mid .fb-ic{background:#A86F00;}
  .fb-t{font-size:21px;font-weight:800;line-height:1.3;}
  .fb.ok .fb-t{color:var(--good-ink);} .fb.no .fb-t{color:var(--bad-ink);} .fb.mid .fb-t{color:#4A3000;}
  .why-btn{all:unset;cursor:pointer;margin-left:auto;font-size:15px;font-weight:700;color:var(--pine);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 13px;line-height:1.5;white-space:nowrap;}
  .why-btn:focus-visible{outline:3px solid var(--pine);outline-offset:2px;}
  .why{margin:8px 2px 0;padding:10px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;font-weight:600;font-size:16.5px;line-height:1.6;color:var(--ink);}
  .why[hidden]{display:none;}
  .opt.shake{animation:shake .35s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  @keyframes fbIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .review{margin:18px auto 0;max-width:420px;text-align:left;background:var(--sun-soft);border-radius:18px;padding:12px 16px;}
  .review h3{margin:0 0 6px;font-size:17px;font-weight:800;color:#4A3000;}
  .review ul{list-style:none;margin:0;padding:0;}
  .review li{display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:700;color:var(--ink);line-height:1.45;}
  .hear-mini{all:unset;cursor:pointer;flex:none;width:34px;height:34px;border-radius:50%;background:var(--leaf-deep);display:grid;place-items:center;}
  .hear-mini svg{width:18px;height:18px;fill:#fff;}
  .hear-mini:focus-visible{outline:3px solid var(--pine);outline-offset:2px;}
  .slow{all:unset;box-sizing:border-box;cursor:pointer;padding:0 18px;height:52px;display:inline-flex;align-items:center;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16.5px;color:var(--pine);}
  .slow:focus-visible{outline:3px solid var(--pine);outline-offset:2px;}
  .hint{margin:10px 0 0;font-size:15px;font-weight:600;color:var(--ink-soft);}
  .tin{box-sizing:border-box;width:100%;margin-top:16px;padding:15px 16px;border:2px solid var(--line);border-radius:18px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--paper);}
  .tin:focus{outline:3px solid var(--pine);outline-offset:2px;background:#fff;}
  .tin.shake{animation:shake .35s ease;border-color:#C24A33;}
  .spell-out{display:flex;align-items:center;gap:12px;margin:12px 0 0;}
  .spell-out b{font-size:24px;letter-spacing:.06em;color:var(--pine);}
  .hook{margin:14px 0 0;padding:14px 16px;border-radius:18px;background:var(--paper);border:1.5px solid #C5DCCB;}
  .hook-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hook-row .big-en{font-size:clamp(22px,6vw,28px);}
  .hook-bn{margin:6px 0 0;font-weight:700;font-size:17px;color:var(--leaf-deep);}
  /* ---------- trap (সাবধান) ---------- */
  .trap-tag{display:inline-block;padding:3px 14px;border-radius:999px;background:#FBE3DD;color:#7A2414;font-weight:800;font-size:15.5px;margin:0 0 10px;}
  .trap-pair{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px;}
  .trap-it{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;}
  .trap-it .hear-mini{width:42px;height:42px;}
  .trap-it .hear-mini svg{width:22px;height:22px;}
  .trap-tx{display:flex;flex-direction:column;gap:2px;line-height:1.4;}
  .trap-tx b{font-size:22px;color:var(--pine);font-weight:800;}
  .trap-tx span{font-size:16.5px;font-weight:700;color:var(--leaf-deep);}
  .trap-tip{margin:12px 0 0;padding:12px 15px;border-radius:16px;background:var(--sun-soft);color:#4A3000;font-weight:700;font-size:17px;line-height:1.65;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>

<header class="wrap bar">

  <a class="brand" href="index.html"><img src="logo.png" alt="" width="34" height="34"><span>Bidesh English</span></a>

<main class="wrap">
  <h1 id="lessonTitle">লেসন লোড হচ্ছে…</h1>
  <p class="sub" id="lessonSub"></p>
  <p class="stepname" id="stepName"></p>
  <div class="pctrow"><span class="pct" id="pct" style="left:0%"></span></div>
  <div class="track" id="progress" role="progressbar" aria-label="লেসনের অগ্রগতি" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span class="fill" id="fill" style="width:0%"></span>
    <span class="plane" id="plane" style="left:0%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21,16.01L21,14L13,9V3.5C13,2.67 12.33,2 11.5,2S10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16.01Z"/></svg></span>
  </div>
  <div class="backrow"><button type="button" class="backmini" id="backBtn" aria-label="Back, আগের ধাপে ফিরুন" style="visibility:hidden"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back</button></div>
  <section class="card" id="stage" tabindex="-1" aria-live="polite"></section>
</main>
<div style="height:92px"></div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').replace(/[^a-z0-9-]/gi, '');
  var $ = function(s){ return document.querySelector(s); };
  var stage = $('#stage');
  var reviewMode = params.get('review') === '1';
  var L, flow, idx = 0, S, WHO = 'বস', sub = 0, startSub = 0, curBack = null, hideBack = false;

  var STEP_NAME = { scene:'দৃশ্য', phrases:'Phrase Cards', traps:'সাবধান! ভুল এড়ান', type:'লিখে দেখুন', listen:'শুনে চেনা', speak:'বলে Practice', dialogue:'কথোপকথন', quiz:'Quick Quiz', done:'সম্পন্ন!' };
  var ICON_SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  var ICON_MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>';
  var ICON_PLANE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21,16.01L21,14L13,9V3.5C13,2.67 12.33,2 11.5,2S10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16.01Z"/></svg>';
  var bn = function(n){ return String(n).replace(/\d/g, function(d){ return '০১২৩৪৫৬৭৮৯'[d]; }); };
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var shuffle = function(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
  function enter(){ stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter'); }

  /* ---------- storage (safe) ---------- */
  function read(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
  function write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function dstr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function bumpStreak(){
    var s = read('be_streak', { last:'', count:0 });
    var t = new Date(), y = new Date(); y.setDate(y.getDate()-1);
    if (s.last === dstr(t)) return s.count;
    s.count = (s.last === dstr(y)) ? s.count + 1 : 1;
    s.last = dstr(t); write('be_streak', s); return s.count;
  }

  /* ---------- speech ---------- */
  var canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function say(text, rate, el){
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      document.querySelectorAll('.playing').forEach(function(x){ x.classList.remove('playing'); });
      var u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate || 0.9;
      if (el){ el.classList.add('playing'); var off = function(){ el.classList.remove('playing'); }; u.onend = off; u.onerror = off; setTimeout(off, 8000); }
      var vs = speechSynthesis.getVoices();
      var v = vs.find(function(x){ return /^en[-_]US/i.test(x.lang); }) || vs.find(function(x){ return /^en/i.test(x.lang); });
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch(e){}
  }
  function words(t){
    return t.toLowerCase().replace(/i'm/g,'i am').replace(/i'll/g,'i will').replace(/o'clock/g,'oclock').replace(/wasn't/g,'was not')
      .replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  }
  function matchScore(target, heard){
    var t = words(target), h = words(heard); if (!t.length) return 0;
    var pool = h.slice(), hit = 0;
    t.forEach(function(w){ var i = pool.indexOf(w); if (i > -1){ hit++; pool.splice(i,1); } });
    return hit / t.length;
  }
  window.__beMatch = matchScore;

  /* ---------- shell ---------- */
  function unitsOf(st){
    return st === 'phrases' ? (L.phrases || []).length : st === 'traps' ? (L.traps || []).length : st === 'type' ? (L.typing || []).length : st === 'listen' ? (L.listening || []).length :
           st === 'speak' ? (L.speak || []).length : st === 'dialogue' ? (L.dialogue || []).length :
           st === 'quiz' ? (L.quiz || []).length : 0;
  }
  var doneBefore = false, doneStars = 0, replayStarted = false;
  function pctNow(){
    if (flow[idx] === 'done') return 100;
    var tot = 0, before = 0;
    flow.forEach(function(st, k){ var u = unitsOf(st); tot += u; if (k < idx) before += u; });
    return tot ? Math.min(99, Math.round((before + sub) / tot * 100)) : 0;
  }
  function paintProgress(){
    var showDone = doneBefore && !replayStarted && flow[idx] === 'scene';
    var pc = showDone ? 100 : pctNow();
    var tf = 'translateX(-' + pc + '%)';
    $('#fill').style.width = pc + '%';
    $('#progress').setAttribute('aria-valuenow', pc);
    $('#pct').textContent = bn(pc) + '%';
    $('#pct').style.left = pc + '%'; $('#pct').style.transform = tf;
    $('#plane').style.left = pc + '%'; $('#plane').style.transform = 'translate(-' + pc + '%,-50%)';
    $('#stepName').textContent = showDone
      ? '✓ আপনি এই লেসন শেষ করেছেন · ' + bn(doneStars) + '/৫ ⭐'
      : 'ধাপ ' + bn(idx+1) + '/' + bn(flow.length) + ' · ' + STEP_NAME[flow[idx]] + (doneBefore && flow[idx] !== 'done' ? ' · আবার practice' : '');
    $('#backBtn').style.visibility = (hideBack || (reviewMode && idx === 0) || flow[idx] === 'scene' || flow[idx] === 'done') ? 'hidden' : 'visible';
  }
  function saveResume(){
    if (reviewMode) return;
    var m = read('be_resume', {});
    if (flow[idx] === 'done' || flow[idx] === 'scene' || pctNow() === 0) { delete m[L.id]; }
    else { m[L.id] = { step: idx, sub: sub, pct: pctNow(), S: S, at: Date.now() }; }
    write('be_resume', m);
  }
  function setSub(k){ sub = k; paintProgress(); saveResume(); }
  function go(n){
    idx = n; sub = startSub; curBack = null; hideBack = false; paintProgress();
    if (canSpeak) { try { speechSynthesis.cancel(); } catch(e){} }
    stage.className = 'card s-' + flow[idx];
    if (flow[idx] !== 'scene' && flow[idx] !== 'done') track('lesson_step',{lesson_id:L.id,step:flow[idx]});
    R[flow[idx]]();
    startSub = 0;
    if (flow[idx] === 'scene' || flow[idx] === 'done') saveResume();
    enter();
    stage.focus({ preventScroll:true });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function next(){ go(idx + 1); }
  function nextBtn(label, id){ return '<div class="row"><button class="btn btn-main" id="' + (id || 'nextBtn') + '">' + (label || 'পরের ধাপ →') + '</button></div>'; }

  /* ---------- steps ---------- */
  var PRAISE = ['Excellent!', 'Great job!', 'Well done!', 'Perfect!', 'Nice one!'], praiseN = 0;
  function praise(){ var p = PRAISE[praiseN % PRAISE.length]; praiseN++; return p; }
  function fbHtml(kind, title, why, openWhy){
    var ic = kind === 'ok' ? '✓' : kind === 'no' ? '✕' : '★';
    return '<div class="fb ' + kind + '"><span class="fb-ic" aria-hidden="true">' + ic + '</span><b class="fb-t">' + esc(title) + '</b>' +
      (why ? '<button type="button" class="why-btn" id="whyBtn" aria-expanded="' + (openWhy ? 'true' : 'false') + '">কেন? ' + (openWhy ? '▴' : '▾') + '</button>' : '') + '</div>' +
      (why ? '<p class="why" id="whyTxt"' + (openWhy ? '' : ' hidden') + '>' + esc(why) + '</p>' : '');
  }
  function wireWhy(){
    var b = $('#whyBtn'); if (!b) return;
    b.onclick = function(){
      var t = $('#whyTxt'), open = t.hasAttribute('hidden');
      if (open) t.removeAttribute('hidden'); else t.setAttribute('hidden', '');
      b.setAttribute('aria-expanded', open ? 'true' : 'false'); b.textContent = 'কেন? ' + (open ? '▴' : '▾');
    };
  }
  $('#backBtn').onclick = function(){
    if (curBack && curBack()) return;
    if (idx <= 0) return;
    var pi = idx - 1, u = unitsOf(flow[pi]);
    startSub = u ? u - 1 : 0; go(pi);
  };

  var R = {};

  R.scene = function(){
    stage.innerHTML = '<div class="scene-ic">' + ICON_PLANE + '</div><h2>পরিস্থিতি</h2><p class="lede">' + esc(L.scene) + '</p>' +
      (L.hook ? '<div class="hook"><div class="hook-row"><p class="big-en">' + esc(L.hook.en) + '</p>' + (canSpeak ? '<button type="button" class="hear-mini" id="hookHear" aria-label="শুনুন">' + ICON_SPEAKER + '</button>' : '') + '</div>' + (L.hook.bn ? '<p class="hook-bn">' + esc(L.hook.bn) + '</p>' : '') + '</div>' : '') + nextBtn(doneBefore && !replayStarted ? 'আবার practice করি →' : 'শুরু করি →');
    if ($('#hookHear')) $('#hookHear').onclick = function(){ say(L.hook.en); };
    $('#nextBtn').onclick = function(){ replayStarted = true; track('lesson_start',{lesson_id:L.id}); next(); };
  };

  R.phrases = function(){
    var i = Math.min(startSub, L.phrases.length - 1), P = L.phrases;
    curBack = function(){ if (i > 0){ i--; card(); enter(); return true; } return false; };
    function card(){
      var p = P[i], last = i === P.length - 1;
      setSub(i);
      var dots = ''; for (var d = 0; d < P.length; d++) dots += '<i class="' + (d < i ? 'on' : d === i ? 'now' : '') + '"></i>';
      var ear = /^বুঝে/.test(p.tag || '');
      stage.innerHTML =
        '<div class="tk-top"><div class="tk-head">' + (p.tag ? '<span class="tag' + (ear ? ' ear' : '') + '">' + (ear ? '👂 ' : '💬 ') + esc(p.tag) + '</span>' : '<span></span>') + '<span class="tk-count">' + bn(i+1) + ' / ' + bn(P.length) + '</span></div>' +
        '<div class="dots" aria-hidden="true">' + dots + '</div></div>' +
        '<div class="tk-body"><p class="big-en">' + esc(p.en) + '</p>' +
          '<p class="ph-bn">' + esc(p.bn) + '</p>' +
          (canSpeak ? '<div class="ph-actions"><button type="button" class="play" id="hear" aria-label="শুনুন"><span class="play-ic">' + ICON_SPEAKER + '</span>শুনুন</button><button type="button" class="slow" id="slow">🐢 ধীরে শুনুন</button></div>' : '') +
        '</div>' +
        (p.pr ? '<div class="tk-perf"></div><div class="tk-foot"><span class="pr-label">বাংলায় আনুমানিক উচ্চারণ</span><p class="pr-text">' + esc(p.pr) + '</p></div>' : '') +
        '<div class="tk-actions"><div class="row"><button class="btn btn-main btn-next" id="nextCard">Next <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>' +
          (canSpeak ? (i === 0 ? '<p class="hint">🔊 শব্দ না এলে ভলিউম বাড়ান বা Chrome-এ খুলুন।</p>' : '') : '<p class="note info">আপনার ডিভাইসে শব্দ শোনার সুবিধা নেই। ইংরেজি লেখা আর উচ্চারণ দেখে পড়ুন।</p>') + '</div>';
      if ($('#hear')) $('#hear').onclick = function(){ say(p.en, 0.9, $('#hear')); };
      if ($('#slow')) $('#slow').onclick = function(){ say(p.en, 0.55, $('#slow')); };
      $('#nextCard').onclick = function(){ if (last) next(); else { i++; card(); enter(); } };
    }
    card();
  };

  R.traps = function(){
    var T = L.traps, i = Math.min(startSub, T.length - 1);
    curBack = function(){ if (i > 0){ i--; card(); enter(); return true; } return false; };
    function card(){
      var t = T[i], last = i === T.length - 1;
      setSub(i);
      stage.innerHTML =
        '<span class="trap-tag">⚠ সাবধান ' + bn(i+1) + '/' + bn(T.length) + '</span>' +
        '<h2>' + esc(t.title) + '</h2>' +
        (t.intro ? '<p class="lede" style="font-size:18px">' + esc(t.intro) + '</p>' : '') +
        '<div class="trap-pair">' + t.items.map(function(it, k){
          return '<div class="trap-it">' + (canSpeak ? '<button type="button" class="hear-mini" data-k="' + k + '" aria-label="শুনুন">' + ICON_SPEAKER + '</button>' : '') +
            '<div class="trap-tx"><b>' + esc(it.en) + '</b>' + (it.note ? '<span>' + esc(it.note) + '</span>' : '') + '</div></div>';
        }).join('') + '</div>' +
        '<p class="trap-tip">' + esc(t.tip) + '</p>' +
        nextBtn(last ? 'পরের ধাপ →' : 'পরেরটা →', 'nextTrap');
      stage.querySelectorAll('.hear-mini').forEach(function(b){ b.onclick = function(){ var it = t.items[+b.dataset.k]; say(it.say || it.en); }; });
      $('#nextTrap').onclick = function(){ if (last) next(); else { i++; card(); enter(); } };
    }
    card();
  };

  R.type = function(){
    var T = L.typing, q = Math.min(startSub, T.length - 1);
    function norm(t){ return String(t).replace(/[০-৯]/g, function(d){ return '০১২৩৪৫৬৭৮৯'.indexOf(d); }).toLowerCase().replace(/[\s,.\-_'"!?$]/g, ''); }
    function ask(){
      var it = T[q], last = q === T.length - 1, tries = 0, done = false;
      setSub(q);
      stage.innerHTML =
        '<p class="counter">লিখুন ' + bn(q+1) + '/' + bn(T.length) + '</p>' +
        '<h2>' + esc(it.ask) + '</h2>' +
        (it.en ? '<p class="big-en" style="font-size:clamp(22px,5.8vw,28px);margin:0 0 6px">' + esc(it.en) + '</p>' : '') +
        (it.say ? (canSpeak ? '<div class="row" style="margin-top:6px"><button class="btn btn-alt" id="tPlay">' + ICON_SPEAKER + 'বাজান</button><button class="btn btn-alt" id="tSlow">🐢 ধীরে</button></div>' : '<p class="big-en" style="font-size:24px">' + esc(it.say) + '</p>') : '') +
        '<input class="tin" id="tIn" type="text" inputmode="' + (it.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(it.ph || 'এখানে লিখুন') + '" aria-label="আপনার উত্তর">' +
        '<div class="row" id="tBtns"><button class="btn btn-main" id="tCheck">দেখি</button><button class="btn btn-alt" id="tSkip">এড়িয়ে যান</button></div><div id="fb"></div>';
      if ($('#tPlay')) { $('#tPlay').onclick = function(){ say(it.say); }; $('#tSlow').onclick = function(){ say(it.say, 0.55); }; setTimeout(function(){ say(it.say); }, 250); }
      var inp = $('#tIn');
      function advance(){ if (last) next(); else { q++; ask(); enter(); } }
      function finish(kind, title, extra){
        done = true; inp.setAttribute('readonly', 'readonly'); $('#tBtns').innerHTML = '';
        $('#fb').innerHTML = fbHtml(kind, title) + (extra || '') + nextBtn(last ? 'পরের ধাপ →' : 'পরের প্রশ্ন →', 'nx');
        var sp = $('#spellHear'); if (sp) sp.onclick = function(){ say(sp.getAttribute('data-say'), 0.6); };
        $('#nx').onclick = advance; $('#nx').focus();
      }
      function check(){
        if (done) return;
        var v = inp.value.trim();
        if (!v){ inp.focus(); return; }
        if (it.free){
          var letters = v.replace(/[^A-Za-z]/g, '').toUpperCase().split('');
          var extra = letters.length ? '<p class="spell-out">' + (canSpeak ? '<button type="button" class="hear-mini" id="spellHear" data-say="' + esc(letters.join(', ')) + '" aria-label="বানান শুনুন">' + ICON_SPEAKER + '</button>' : '') + '<b>' + esc(letters.join(' - ')) + '</b></p><p class="hint">কাউন্টারে এভাবে ধীরে বানান বলবেন।</p>' : '<p class="hint">ইংরেজি অক্ষরে লিখলে বানান শোনাতে পারব।</p>';
          finish('ok', praise(), extra); return;
        }
        tries++;
        var ok = it.answers.some(function(a){ return norm(a) === norm(v); });
        if (ok) finish('ok', tries === 1 ? praise() : 'Got it!', it.why ? '<p class="why">' + esc(it.why) + '</p>' : '');
        else if (tries >= 2) finish('mid', 'প্রায় হয়েছে! সঠিক: ' + (it.show || it.answers[0]), it.why ? '<p class="why">' + esc(it.why) + '</p>' : '');
        else { inp.classList.add('shake'); setTimeout(function(){ inp.classList.remove('shake'); }, 400); $('#fb').innerHTML = fbHtml('no', 'আরেকবার চেষ্টা করুন'); inp.focus(); inp.select(); }
      }
      $('#tCheck').onclick = check;
      $('#tSkip').onclick = advance;
      inp.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); check(); } };
      curBack = function(){ if (q > 0){ q--; ask(); enter(); return true; } return false; };
    }
    ask();
  };

  R.listen = function(){
    var Q = L.listening, q = Math.min(startSub, Q.length - 1);
    S.L = S.L || [];
    function ask(){
      var item = Q[q], opts = shuffle(item.options), done = false, tries = 0;
      setSub(q);
      stage.innerHTML =
        '<p class="counter">প্রশ্ন ' + bn(q+1) + '/' + bn(Q.length) + '</p>' +
        '<h2>' + (canSpeak ? 'শুনুন, তারপর অর্থ বাছুন' : 'এই বাক্যের অর্থ কী?') + '</h2>' +
        (canSpeak ? '<div class="row" style="margin-top:6px"><button class="btn btn-alt" id="play">' + ICON_SPEAKER + 'বাজান</button><button class="btn btn-alt" id="playSlow">🐢 ধীরে</button></div>' : '<p class="big-en">' + esc(item.say) + '</p>') +
        '<div class="opts" id="opts">' + opts.map(function(o, k){ return '<button class="opt" data-k="' + k + '">' + esc(o.t) + '</button>'; }).join('') + '</div>' +
        '<div id="fb"></div>';
      if ($('#playSlow')) $('#playSlow').onclick = function(){ say(item.say, 0.55); };
      if ($('#play')) { $('#play').onclick = function(){ say(item.say); }; setTimeout(function(){ say(item.say); }, 250); }
      document.querySelectorAll('#opts .opt').forEach(function(b){
        b.onclick = function(){
          if (done || b.getAttribute('aria-disabled') === 'true') return;
          tries++;
          var o = opts[+b.dataset.k], last = q === Q.length - 1, why = item.say + ' — ' + item.why;
          if (tries === 1) S.L[q] = o.ok ? 1 : 0;
          function finish(kind, title, open){
            done = true;
            document.querySelectorAll('#opts .opt').forEach(function(x){ x.setAttribute('aria-disabled','true'); if (opts[+x.dataset.k].ok) x.classList.add('good'); });
            $('#fb').innerHTML = fbHtml(kind, title, why, open) + nextBtn(last ? 'পরের ধাপ →' : 'পরের প্রশ্ন →', 'nx');
            wireWhy();
            $('#nx').onclick = function(){ if (last) next(); else { q++; ask(); enter(); } };
            $('#nx').focus();
          }
          if (o.ok) finish('ok', tries === 1 ? praise() : 'Got it!', tries > 1);
          else {
            b.classList.add('bad', 'shake'); b.setAttribute('aria-disabled', 'true');
            if (tries >= 2) finish('no', 'Not quite', true);
            else $('#fb').innerHTML = fbHtml('no', 'Try again');
          }
        };
      });
      curBack = function(){ if (q > 0){ q--; ask(); enter(); return true; } return false; };
    }
    ask();
  };

  R.speak = function(){
    var list = L.speak.map(function(i){ return L.phrases[i]; }), n = Math.min(startSub, L.speak.length - 1), busy = false;
    curBack = function(){ if (busy) return true; if (n > 0){ n--; show(); enter(); return true; } return false; };
    function show(){
      var p = list[n], last = n === list.length - 1;
      setSub(n);
      stage.innerHTML =
        '<p class="counter">বলুন ' + bn(n+1) + '/' + bn(list.length) + '</p>' +
        '<h2>এবার নিজে বলুন</h2>' +
        '<div class="speak-box"><div class="tk-main"><p class="big-en">' + esc(p.en) + '</p>' +
          (canSpeak ? '<button class="hear" id="hear" aria-label="শুনুন">' + ICON_SPEAKER + '</button>' : '') + '</div>' +
          '<p class="bn-line" style="margin:8px 0 0">' + esc(p.bn) + '</p></div>' +
        '<div class="row">' +
          (SR ? '<button class="btn btn-main" id="mic">' + ICON_MIC + 'বলুন</button>' : '<button class="btn btn-main" id="manual">আমি নিজে বলেছি ✓</button>') +
        '</div>' +
        '<p class="mic-status" id="status" role="status"></p>' +
        (SR ? '' : '<p class="note info">এই ব্রাউজারে মাইক দিয়ে মেলানো যায় না। জোরে বলে অভ্যাস করুন, তারপর বোতামে চাপুন। মাইক পরীক্ষা করতে Chrome ব্যবহার করুন।</p>') +
        '<div id="after"></div>';
      if ($('#hear')) $('#hear').onclick = function(){ say(p.en); };
      if ($('#manual')) $('#manual').onclick = advance;
      if ($('#mic')) $('#mic').onclick = function(){ record(p); };
    }
    function advance(){ if (n === list.length - 1) next(); else { n++; show(); enter(); } }
    function showNext(good){
      $('#after').insertAdjacentHTML('beforeend', nextBtn(n === list.length - 1 ? 'পরের ধাপ →' : 'পরের বাক্য →', 'nx'));
      $('#nx').onclick = advance; $('#nx').focus();
    }
    function record(p){
      if (busy) return;
      var st = $('#status'), fin = false, got = false, rec;
      try { rec = new SR(); } catch(e){ st.textContent = 'মাইক চালু করা যায়নি।'; showNext(); return; }
      rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3;
      busy = true; st.textContent = '🎤 শুনছি… এখন বলুন';
      function fail(msg){ if (fin) return; fin = true; busy = false; st.innerHTML = ''; $('#after').innerHTML = '<p class="note bad">' + msg + '</p><div class="row"><button class="btn btn-main" id="again">আবার চেষ্টা করুন</button><button class="btn btn-alt" id="skip">এড়িয়ে যান →</button></div>'; $('#again').onclick = function(){ $('#after').innerHTML = ''; record(p); }; $('#skip').onclick = advance; }
      rec.onresult = function(e){
        got = true; if (fin) return; fin = true; busy = false;
        var alts = []; for (var i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
        var best = 0, bestT = alts[0] || '';
        alts.forEach(function(a){ var s = matchScore(p.en, a); if (s > best){ best = s; bestT = a; } });
        if (best >= 0.6){ st.innerHTML = ''; $('#after').innerHTML = '<p class="note good">✅ দারুণ! আপনার বলা মিলে গেছে।</p>'; showNext(true); }
        else { st.innerHTML = ''; $('#after').innerHTML = '<p class="note bad">আমরা শুনেছি: “' + esc(bestT) + '”। আরেকবার ধীরে ধীরে বলুন।</p><div class="row"><button class="btn btn-main" id="again">আবার চেষ্টা করুন</button><button class="btn btn-alt" id="skip">এড়িয়ে যান →</button></div>'; $('#again').onclick = function(){ $('#after').innerHTML = ''; record(p); }; $('#skip').onclick = advance; }
      };
      rec.onerror = function(e){
        var c = e && e.error;
        if (c === 'not-allowed' || c === 'service-not-allowed') fail('মাইকের অনুমতি দেওয়া হয়নি। ঠিকানা বারের পাশে মাইক আইকনে চেপে অনুমতি দিন।');
        else if (c === 'no-speech') fail('কিছু শুনতে পাইনি। আবার চেষ্টা করুন।');
        else fail('মাইক এখন কাজ করছে না। নিচের বোতামে চেপে এগিয়ে যান।');
      };
      rec.onend = function(){ if (!got) fail('কিছু শুনতে পাইনি। আবার চেষ্টা করুন।'); };
      try { rec.start(); } catch(e){ fail('মাইক চালু করা যায়নি।'); }
    }
    show();
  };

  R.dialogue = function(){
    var D = L.dialogue, t = Math.min(startSub, D.length - 1), turns = [], seen = {};
    S.D = S.D || [];
    function turn(){
      var d = D[t], choices = shuffle(d.choices), last = t === D.length - 1;
      setSub(t);
      turns.length = t;
      stage.innerHTML =
        '<p class="counter">কথা ' + bn(t+1) + '/' + bn(D.length) + '</p>' +
        '<div class="chat">' + turns.join('') +
          '<div class="bubble b-boss"><span class="who">' + esc(WHO) + '</span>' + esc(d.boss) + '<small>' + esc(d.bn) + '</small></div>' +
        '</div>' +
        '<h2>আপনি কী বলবেন?</h2>' +
        '<div class="opts" id="opts">' + choices.map(function(c, k){ return '<button class="opt" data-k="' + k + '">' + esc(c.en) + '</button>'; }).join('') + '</div>' +
        '<div id="fb"></div>';
      document.querySelectorAll('#opts .opt').forEach(function(b){
        b.onclick = function(){
          if (b.getAttribute('aria-disabled') === 'true') return;
          var c = choices[+b.dataset.k];
          if (!seen[t]) { seen[t] = true; S.D[t] = c.stars; }
          document.querySelectorAll('#opts .opt').forEach(function(x){ x.setAttribute('aria-disabled','true'); });
          if (c.stars === 3) b.classList.add('good'); else if (c.stars === 1) b.classList.add('bad', 'shake');
          var kind = c.stars === 3 ? 'ok' : c.stars === 2 ? 'mid' : 'no';
          var title = c.stars === 3 ? praise() : c.stars === 2 ? 'Good' : 'Not quite';
          $('#fb').innerHTML =
            '<div class="chat" style="margin-top:14px"><div class="bubble b-me"><span class="who">আপনি</span>' + esc(c.en) + '</div>' +
            '<div class="bubble b-boss"><span class="who">' + esc(WHO) + '</span>' + esc(c.reply) + '<small>' + esc(c.replyBn) + '</small></div></div>' +
            fbHtml(kind, title, c.tip, c.stars < 3) +
            (c.stars < 3 ? '<div class="row"><button class="btn btn-alt" id="retry">আবার চেষ্টা করুন</button></div>' : '') +
            nextBtn(last ? 'পরের ধাপ →' : 'কথা চালিয়ে যান →', 'nx');
          wireWhy();
          if ($('#retry')) $('#retry').onclick = function(){ turn(); enter(); };
          $('#nx').onclick = function(){
            turns[t] = '<div class="bubble b-boss"><span class="who">' + esc(WHO) + '</span>' + esc(d.boss) + '</div><div class="bubble b-me"><span class="who">আপনি</span>' + esc(c.en) + '</div><div class="bubble b-boss"><span class="who">' + esc(WHO) + '</span>' + esc(c.reply) + '</div>';
            if (last) next(); else { t++; turn(); enter(); }
          };
          $('#nx').focus();
        };
      });
      curBack = function(){ if (t > 0){ delete seen[t]; t--; delete seen[t]; turn(); enter(); return true; } return false; };
    }
    turn();
  };

  R.quiz = function(){
    var Q = L.quiz, q = Math.min(startSub, Q.length - 1);
    S.Q = S.Q || [];
    function ask(){
      var item = Q[q], done = false, tries = 0, last = q === Q.length - 1;
      setSub(q);
      stage.innerHTML =
        '<p class="counter">প্রশ্ন ' + bn(q+1) + '/' + bn(Q.length) + '</p>' +
        '<h2>' + esc(item.q) + '</h2>' +
        '<div class="opts tf" id="opts"><button class="opt" data-v="true">✔ ঠিক</button><button class="opt" data-v="false">✖ ভুল</button></div><div id="fb"></div>';
      document.querySelectorAll('#opts .opt').forEach(function(b){
        b.onclick = function(){
          if (done || b.getAttribute('aria-disabled') === 'true') return;
          tries++;
          var v = b.dataset.v === 'true', right = v === item.a;
          if (tries === 1) S.Q[q] = right ? 1 : 0;
          if (right){
            done = true;
            document.querySelectorAll('#opts .opt').forEach(function(x){ x.setAttribute('aria-disabled','true'); if ((x.dataset.v === 'true') === item.a) x.classList.add('good'); });
            $('#fb').innerHTML = fbHtml('ok', tries === 1 ? praise() : 'Got it!', item.why, tries > 1) + nextBtn(last ? 'ফলাফল দেখুন →' : 'পরের প্রশ্ন →', 'nx');
            wireWhy();
            $('#nx').onclick = function(){ if (last) next(); else { q++; ask(); enter(); } };
            $('#nx').focus();
          } else {
            b.classList.add('bad', 'shake'); b.setAttribute('aria-disabled', 'true');
            $('#fb').innerHTML = fbHtml('no', 'Try again');
          }
        };
      });
      curBack = function(){ if (q > 0){ q--; ask(); enter(); return true; } return false; };
    }
    ask();
  };

  R.done = function(){
    var has = function(k){ return flow.indexOf(k) > -1; };
    var cnt = function(a){ return (a || []).filter(function(x){ return x === 1; }).length; };
    var sumD = (S.D || []).reduce(function(a, x){ return a + (x || 0); }, 0);
    var nL = has('listen') ? (L.listening || []).length : 0, nQ = has('quiz') ? (L.quiz || []).length : 0, nD = has('dialogue') ? (L.dialogue || []).length : 0;
    var okL = cnt(S.L), okQ = cnt(S.Q);
    var got = (has('dialogue') ? sumD : 0) + okQ + okL;
    var max = nD * 3 + nQ + nL;
    var five = max ? Math.max(1, Math.round(5 * got / max)) : 5;
    var prog = read('be_progress', {});
    var prev = prog[L.id] ? prog[L.id].stars : 0;
    if (reviewMode){ var rv = read('be_review', {}); rv[L.id] = dstr(new Date()); write('be_review', rv); }
    else { prog[L.id] = { stars: Math.max(prev, five), date: dstr(new Date()) }; write('be_progress', prog); }
    var streak = bumpStreak();
    track(reviewMode ? 'lesson_review_done' : 'lesson_complete',{lesson_id:L.id,stars:five});
    var rows = '';
    if (nL) rows += '<li><span>শুনে চেনা</span><b>' + bn(okL) + '/' + bn(nL) + '</b></li>';
    if (nD) rows += '<li><span>কথোপকথনের তারা</span><b>' + bn(sumD) + '/' + bn(nD * 3) + '</b></li>';
    if (nQ) rows += '<li><span>Quick Quiz</span><b>' + bn(okQ) + '/' + bn(nQ) + '</b></li>';
    var miss = [];
    (L.listening || []).forEach(function(it, k){ if (has('listen') && S.L && S.L[k] === 0) miss.push(it.say); });
    (L.dialogue || []).forEach(function(d, k){ if (has('dialogue') && S.D && S.D[k] != null && S.D[k] < 3){ var best = d.choices.filter(function(c){ return c.stars === 3; })[0]; if (best) miss.push(best.en); } });
    miss = miss.slice(0, 4);
    var review = miss.length && canSpeak
      ? '<div class="review"><h3>এই বাক্যগুলো আবার শুনুন</h3><ul>' + miss.map(function(m){ return '<li><button type="button" class="hear-mini" data-say="' + esc(m) + '" aria-label="শুনুন">' + ICON_SPEAKER + '</button><span>' + esc(m) + '</span></li>'; }).join('') + '</ul></div>'
      : (miss.length ? '<div class="review"><h3>এই বাক্যগুলো আবার পড়ুন</h3><ul>' + miss.map(function(m){ return '<li><span>' + esc(m) + '</span></li>'; }).join('') + '</ul></div>' : '');
    var nextLabel = L.next && L.next.title ? 'পরের লেসন: ' + esc(L.next.title) : '';
    var starHtml = ''; for (var k = 0; k < five; k++) starHtml += '<span style="animation-delay:' + (0.15 + k * 0.12) + 's">⭐</span>';
    stage.innerHTML =
      '<div class="result"><div class="party" aria-hidden="true">🎉</div>' +
      '<h2>' + (reviewMode ? 'রিভিশন সম্পন্ন!' : 'অভিনন্দন! লেসন সম্পন্ন') + '</h2>' +
      '<p class="lede" style="margin-bottom:6px">আপনি “' + esc(L.title) + '” ' + (reviewMode ? 'ঝালিয়ে নিয়েছেন।' : 'শেষ করেছেন।') + '</p>' +
      '<div class="big-stars" aria-label="৫ এর মধ্যে ' + bn(five) + ' তারা">' + starHtml + '</div>' +
      '<p class="score-line">৫ এর মধ্যে ' + bn(five) + '</p>' +
      '<ul class="stats">' + rows + '</ul>' + review +
      '<div class="streak">🔥 ' + bn(streak) + ' দিন টানা practice</div>' +
      '<div class="row">' +
        '<button class="btn btn-alt" id="again">আবার করুন</button>' +
        (nextLabel ? (L.next.id ? '<a class="btn btn-main" href="lesson.html?id=' + encodeURIComponent(L.next.id) + '">' + nextLabel + ' →</a>' : '<button class="btn btn-main" disabled>' + nextLabel + ' (শীঘ্রই আসছে)</button>') : '') +
        '<a class="btn ' + (nextLabel && L.next.id ? 'btn-alt' : 'btn-main') + '" href="index.html#needs">সব লেসন দেখুন</a>' +
      '</div></div>';
    stage.querySelectorAll('.hear-mini').forEach(function(b){ b.onclick = function(){ say(b.getAttribute('data-say')); }; });
    $('#again').onclick = function(){ S = {}; startSub = 0; go(0); };
  };

  /* ---------- start ---------- */
  function missing(){
    $('#lessonTitle').textContent = 'লেসনটি পাওয়া যায়নি';
    $('#progress').style.display = 'none'; $('#stepName').textContent = ''; $('#pct').textContent = '';
    stage.innerHTML = '<div class="missing"><p class="lede">এই লেসনটি এখনো তৈরি হয়নি।</p><a class="btn btn-main" href="index.html#needs">সব লেসনে ফিরুন</a></div>';
  }
  function start(){
    L = window.LESSON; S = {}; WHO = L.who || 'বস';
    var pr = read('be_progress', {})[L.id];
    if (!reviewMode) track('lesson_open',{lesson_id:L.id,repeat:!!pr});
    doneBefore = !!pr; doneStars = pr && pr.stars ? pr.stars : 0; replayStarted = false;
    document.title = L.title + ' | Bidesh English';
    $('#lessonTitle').textContent = L.title;
    $('#lessonSub').textContent = L.titleBn || '';
    if (reviewMode){
      L.listening = shuffle(L.listening || []).slice(0, 4);
      flow = ['listen', 'done']; doneBefore = false; replayStarted = true;
      track('lesson_review_open',{lesson_id:L.id});
      go(0); return;
    }
    flow = L.type === 'B' ? ['phrases','listen','speak','done'] : ['scene','phrases','listen','speak','dialogue','quiz','done'];
    if (L.traps && L.traps.length){ flow.splice(flow.indexOf('phrases') + 1, 0, 'traps'); }
    if (L.typing && L.typing.length){ flow.splice(flow.indexOf('listen') + 1, 0, 'type'); }
    var saved = read('be_resume', {})[L.id];
    var ok = saved && typeof saved.step === 'number' && saved.step > 0 && saved.step < flow.length - 1 && flow[saved.step] !== 'scene';
    if (ok){
      var u = unitsOf(flow[saved.step]);
      if (!(saved.sub >= 0 && saved.sub < u)) saved.sub = 0;
      idx = saved.step; sub = saved.sub; hideBack = true; paintProgress();
      stage.className = 'card s-resume';
      stage.innerHTML = '<div class="scene-ic">' + ICON_PLANE + '</div><h2>আগের জায়গা থেকে চালিয়ে যাবেন?</h2>' +
        '<p class="lede">আপনি এই লেসনের ' + bn(pctNow()) + '% শেষ করেছিলেন। যেখানে থেমেছিলেন, সেখান থেকেই শুরু করতে পারেন।</p>' +
        '<div class="row"><button class="btn btn-main" id="resumeGo">চালিয়ে যান →</button></div>' +
        '<div class="row"><button class="btn btn-alt" id="resumeNew">শুরু থেকে করুন</button></div>';
      enter();
      $('#resumeGo').onclick = function(){ S = saved.S || {}; startSub = saved.sub; go(saved.step); };
      $('#resumeNew').onclick = function(){ var m = read('be_resume', {}); delete m[L.id]; write('be_resume', m); S = {}; startSub = 0; sub = 0; go(0); };
      return;
    }
    go(0);
  }
  if (!id){ missing(); return; }
  var s = document.createElement('script');
  s.src = 'lessons/' + id + '.js';
  s.onload = function(){ if (window.LESSON) start(); else missing(); };
  s.onerror = missing;
  document.head.appendChild(s);
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch(e){} }
})();
</script>
<script src="wa-float.js" defer></script>
</body>
